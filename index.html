w .book:focus-visible{transform:translateY(-5px)}.shelf-row .cover{position:relative;isolation:isolate;width:100%;max-width:146px;height:184px;padding:6px 6px 6px 11px;border-radius:3px 8px 8px 3px;border-left:5px solid #ffffff55;box-shadow:inset 5px 0 7px #0003,5px 5px 0 #382010,9px 9px 10px #2e160b88;transform:perspective(600px) rotateY(-5deg);transform-origin:left center;word-break:break-word}.shelf-row .cover:after{content:'';position:absolute;inset:0 auto 0 0;width:10px;background:linear-gradient(90deg,#0005,#fff4,transparent);pointer-events:none}.shelf-row .cover img{display:block;border-radius:1px 5px 5px 1px}.shelf-row .bookname{font-size:13px;max-width:100%;margin-top:11px;font-weight:800}.shelf .plank{height:22px;margin:0 -18px 16px;background:linear-gradient(#edba7e 0%,#c18a53 30%,#93512a 78%,#5b301a);border-top:2px solid #f6ca8e;box-shadow:0 7px 9px #2c140b88}.shelf-empty{color:#fff9e9;text-align:center;font-weight:800;padding:28px 0 48px}@media(max-width:650px){.library-heading{align-items:flex-start}.medals{gap:5px}.medal{padding:8px 2px}.medal .symbol{font-size:25px}.shelf-row{grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:14px 10px;padding:14px 4px 8px}.shelf-row .cover{height:164px;max-width:128px}.scan-action{width:100%}}@media(prefers-reduced-motion:reduce){.shelf-row .book{transition:none}}

body{background:#faf5ea}

 </style></head><body><div class="app"><div class="notice orientation">📱 タブレットを よこにしてね（この試作版は縦向きでも操作できます）</div><header class="top"><div class="title">📚 わたしの ほんだな</div><div class="row"><button onclick="showSettings()">⚙️ せってい</button></div></header><main id="main"></main></div><div id="overlay" class="modalback hide"><div id="modal" class="modal"></div></div><script>
'use strict';const KEY='reading-log-v24';let state={profile:null,books:{},reads:[]},stream=null,scanTimer=null,detector=null,pendingISBN=null,pendingCover=null,viewLimit=24;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function load(){try{const v=localStorage.getItem(KEY);if(v){const d=JSON.parse(v);if(!d||!Array.isArray(d.reads)||typeof d.books!=='object')throw Error('bad data');state=d}}catch(e){alert('きろくを よみこめません。かってに けさず、データを のこしています。');state={profile:null,books:{},reads:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('ほぞんできませんでした。あきようりょうを かくにんしてください。');return false}}function modal(html){$('modal').innerHTML=html;$('overlay').classList.remove('hide')}function closeModal(){stopScan();$('overlay').classList.add('hide');$('modal').innerHTML=''}function profileForm(edit=false){let p=state.profile||{};modal(`<h2>${edit?'とうろくを なおす':'はじめまして！'}</h2><p>じぶんの じょうほうを いれてね。</p><form id="profileForm"><div class="fields"><div><label>がくねん</label><select name="grade">${Array.from({length:6},(_,i)=>`<option value="${i+1}" ${p.grade==i+1?'selected':''}>${i+1}ねん</option>`).join('')}</select></div><div><label>くみ</label><input name="classroom" required maxlength="15" value="${esc(p.classroom||'1')}"></div><div><label>しゅっせきばんごう</label><input type="number" name="number" min="1" max="99" required value="${esc(p.number||'')}"></div><div><label>なまえ</label><input name="name" maxlength="30" required value="${esc(p.name||'')}"></div></div><div class="actions"><button class="primary" type="submit">ほぞんする</button>${edit?'<button type="button" onclick="closeModal()">やめる</button>':''}</div></form>`);$('profileForm').onsubmit=e=>{e.preventDefault();if(edit&&!confirm('なまえなどを へんこうしますか？\nどくしょきろくは そのまま のこります。'))return;const f=new FormData(e.target);state.profile=Object.fromEntries(f.entries());if(save()){closeModal();render()}}}
function uniqueCount(){return Object.keys(state.books).filter(isbn=>state.reads.some(r=>r.isbn===isbn)).length}function medals(){return [10,20,30,50,100].map((n,i)=>`<button class="medal ${uniqueCount()<n?'lock':''}" onclick="alert('${n}さつで メダル！\\nいま ${uniqueCount()}さつ よんだよ')"><div class="symbol">${['🥉','🥈','🥇','🏆','💎'][i]}</div><b>${n}さつ</b></button>`).join('')}
function render(){if(!state.profile){$('main').innerHTML='<div class="panel center"><h2>📖 ほんを よんだら きろくしよう！</h2><button class="primary" onclick="profileForm()">はじめる</button></div>';return}const list=Object.values(state.books).filter(b=>state.reads.some(r=>r.isbn===b.isbn)).sort((a,b)=>Math.max(...state.reads.filter(r=>r.isbn===b.isbn).map(r=>r.created||0))-Math.max(...state.reads.filter(r=>r.isbn===a.isbn).map(r=>r.created||0)));const visible=list.slice(0,viewLimit);const perRow=window.matchMedia('(max-width:650px)').matches?3:window.innerWidth>=1150?7:window.innerWidth>=950?6:5;const rows=[];for(let i=0;i<visible.length;i+=perRow)rows.push(visible.slice(i,i+perRow));const shelves=rows.map(row=>'<div class="shelf-row">'+row.map(b=>`<button class="book" onclick="bookDetail('${b.isbn}')"><div class="cover" style="background:${color(b.isbn)}" id="cover-${b.isbn}">${esc(b.title)}</div><div class="bookname">${esc(b.title)}</div></button>`).join('')+'</div><div class="plank"></div>').join('');$('main').innerHTML=`<div class="panel library-dashboard"><div class="library-heading"><h2>${esc(state.profile.name)}さんの ほんだな</h2><span class="count">📖 よんだ ほん ${uniqueCount()}さつ</span></div><div class="medals">${medals()}</div><button class="primary scan-action" onclick="startScan()">📷 ほんを よみとる</button></div><div class="shelf">${shelves||'<p class="shelf-empty">まだ ほんが ないよ。さいしょの 1さつを とうろくしよう！</p>'}</div>${list.length>viewLimit?'<div class="center panel"><button onclick="viewLimit+=24;render()">もっと みる</button></div>':''}<p class="small center">きろくは このたんまつに ほぞんされます。ブラウザのデータをけすと、きろくもきえます。</p>`;visible.forEach(b=>displayCover(b.isbn,`cover-${b.isbn}`))}
function color(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))%360;return `linear-gradient(135deg,hsl(${h},50%,57%),hsl(${(h+28)%360},55%,30%))`}
const DB='reading-log-covers';function db(){return new Promise((res,rej)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('covers');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}async function coverGet(k){try{const d=await db();return await new Promise(resolve=>{let r=d.transaction('covers').objectStore('covers').get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)})}catch{return null}}async function coverPut(k,blob){try{const d=await db();return await new Promise(resolve=>{let tx=d.transaction('covers','readwrite');tx.objectStore('covers').put(blob,k);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false)})}catch{return false}}async function coverDelete(k){try{const d=await db();const tx=d.transaction('covers','readwrite');tx.objectStore('covers').delete(k)}catch{}}async function displayCover(isbn,id){const blob=await coverGet(isbn),el=$(id);if(blob&&el){let url=URL.createObjectURL(blob);el.innerHTML=`<img alt="ひょうし" src="${url}">`;setTimeout(()=>URL.revokeObjectURL(url),20000)}}
function bookDetail(isbn){let b=state.books[isbn],reads=state.reads.filter(r=>r.isbn===isbn).sort((a,b)=>b.date.localeCompare(a.date));modal(`<h2>${esc(b.title)}</h2><div class="detail-layout"><div id="detailCover" class="cover" style="background:${color(isbn)};margin:0">${esc(b.title)}</div><div class="detail-info"><p>さくしゃ：${esc(cleanAuthor(b.author)||'ふめい')}</p><p>よんだ かいすう：${reads.length}かい</p><p class="small">ISBN: ${isbn}</p><button class="primary" onclick="registerRead('${isbn}')">もういちど よんだ</button><button type="button" onclick="replaceCover('${isbn}')">📷 ひょうしを とりなおす</button></div></div><h3>どくしょ きろく</h3>${reads.map(r=>`<div class="history"><span>${esc(r.date)}　${['😐','🙂','😊'][r.rating-1]}</span><span class="history-actions"><button onclick="editRead('${r.id}')">なおす</button><button onclick="deleteRead('${r.id}')">けす</button></span></div>`).join('')}<div class="actions"><button onclick="closeModal()">もどる</button></div>`);displayCover(isbn,'detailCover')}
async function replaceCover(isbn){const b=state.books[isbn];if(!b)return;modal(`<h2>📷 ひょうしを とりなおす</h2><p>${esc(b.title)}</p><label>ほんの ひょうしを さつえいしてね</label><input id="replaceCoverFile" type="file" accept="image/*" capture="environment"><div id="replaceCoverPreview"></div><div class="actions"><button onclick="bookDetail('${isbn}')">もどる</button></div>`);$('replaceCoverFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const blob=await resizeBlob(file);const url=URL.createObjectURL(blob);const preview=$('replaceCoverPreview');preview.innerHTML=`<p>この しゃしんで いいかな？</p><img class="preview" alt="さつえいした ひょうし"><div class="actions"><button id="replaceCoverRetake">とりなおす</button><button class="primary" id="replaceCoverSave">これでいい</button></div>`;preview.querySelector('img').src=url;preview.querySelector('#replaceCoverRetake').onclick=()=>{URL.revokeObjectURL(url);$('replaceCoverFile').value='';preview.innerHTML=''};preview.querySelector('#replaceCoverSave').onclick=async()=>{if(await coverPut(isbn,blob)){URL.revokeObjectURL(url);render();bookDetail(isbn)}else alert('ひょうしを ほぞんできませんでした。')};}catch{alert('しゃしんを よみこめませんでした')}}}
function editRead(id){let r=state.reads.find(r=>r.id===id);if(!r)return;readForm(r.isbn,r)}function deleteRead(id){if(!confirm('この どくしょきろくを けしますか？'))return;let r=state.reads.find(r=>r.id===id);state.reads=state.reads.filter(x=>x.id!==id);if(!state.reads.some(x=>x.isbn===r.isbn)){delete state.books[r.isbn];coverDelete(r.isbn)}if(save()){closeModal();render()}}
function registerRead(isbn){if(!navigator.onLine){alert('インターネットに つながってから きろくしてね');return}readForm(isbn)}function readForm(isbn,existing=null){const b=state.books[isbn];modal(`<h2>📖 ${esc(b.title)}</h2><p>ほんを よんだ きろくを つけよう</p><form id="readForm"><label>よんだ ひ</label><input name="date" type="date" required value="${existing?.date||new Date().toLocaleDateString('en-CA')}"><label>おもしろかった？</label><div class="row">${[[3,'😊','とても おもしろい'],[2,'🙂','おもしろい'],[1,'😐','ふつう']].map(([n,e,t])=>`<label style="flex:1;min-width:110px;text-align:center;border:2px solid #e6caa0;border-radius:15px;padding:12px"><input type="radio" name="rating" value="${n}" style="width:auto;min-height:auto" ${existing?.rating===n||(!existing&&n===3)?'checked':''}><div class="star">${e}</div>${t}</label>`).join('')}</div><div class="actions"><button class="primary" type="submit">きろくする</button><button type="button" onclick="closeModal()">やめる</button></div></form>`);$('readForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),date=f.get('date'),rating=Number(f.get('rating'));if(!existing&&state.reads.some(r=>r.isbn===isbn&&r.date===date)&&!confirm('このほんは おなじひに よんだ きろくが あるよ。\nもういちど きろくする？'))return;const before=uniqueCount();if(existing){existing.date=date;existing.rating=rating}else state.reads.push({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),isbn,date,rating,created:Date.now()});if(save()){closeModal();render();let after=uniqueCount();if(!existing&&[10,20,30,50,100].includes(after)&&after>before)alert(`🏅 ${after}さつ メダル！\nおめでとう！`)}}}
function showSettings(){if(!state.profile)return profileForm();modal(`<h2>⚙️ せってい</h2><p>${esc(state.profile.grade)}ねん ${esc(state.profile.classroom)}くみ　${esc(state.profile.number)}ばん　${esc(state.profile.name)}</p><div class="actions"><button onclick="profileForm(true)">じょうほうを なおす</button><button onclick="closeModal()">もどる</button></div><hr><h3>すべての きろくを けす</h3><p class="small">ほんだな・メダル・なまえが すべて きえます。もどせません。</p><label>「ぜんぶけす」と いれてね</label><input id="deleteConfirm" autocomplete="off"><div class="actions"><button class="danger" onclick="eraseAll()">ぜんぶ けす</button></div>`)}async function eraseAll(){if($('deleteConfirm')?.value!=='ぜんぶけす'){alert('かくにんの ことばが ちがうよ');return}if(!confirm('ほんとうに すべて けしますか？'))return;localStorage.removeItem(KEY);try{indexedDB.deleteDatabase(DB)}catch{}state={profile:null,books:{},reads:[]};closeModal();render()}
async function startScan(){if(!navigator.onLine){modal('<h2>オフラインです</h2><p>インターネットに つながってから とうろくしてね。</p><button onclick="closeModal()">もどる</button>');return}if(!navigator.mediaDevices?.getUserMedia){modal('<h2>カメラが つかえません</h2><p>HTTPSでひらくか、ほかのブラウザをつかってね。</p><button onclick="closeModal()">もどる</button>');return}modal(`<h2>📷 バーコードを よみとろう</h2><p>バーコードを わくに あわせてね　📖 ▥</p><div class="scanwrap"><video id="camera" autoplay playsinline muted></video><div class="scanframe"></div></div><p id="scanStatus" class="hint">カメラを じゅんびしているよ…</p><div class="actions"><button onclick="restartScan()">もういちど</button><button onclick="closeModal()">もどる</button></div>`);try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});if(!$('camera')){stopScan();return}$('camera').srcObject=stream;if(!('BarcodeDetector' in window)){ $('scanStatus').textContent='このブラウザはバーコードの自動読み取りに対応していません。対応ブラウザで開いてください。';return}detector=new BarcodeDetector({formats:['ean_13']});$('scanStatus').textContent='ISBNのバーコードを うつしてね';scanLoop()}catch(e){if($('scanStatus'))$('scanStatus').textContent='カメラを つかえません。カメラの きょかを かくにんしてね。'}}
async function scanLoop(){const v=$('camera');if(!v||!stream)return;try{if(v.readyState>=2){const results=await detector.detect(v);let found=results.map(x=>x.rawValue).find(s=>/^97[89]\d{10}$/.test(s));if(found){stopScan();lookup(found);return}}}catch(e){}scanTimer=setTimeout(scanLoop,350)}function stopScan(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}function restartScan(){stopScan();startScan()}
async function lookup(isbn){pendingISBN=isbn;if(state.books[isbn]){registerRead(isbn);return}modal('<h2>🔎 ほんを さがしているよ…</h2><p class="center" style="font-size:35px">◌</p>');let book=null;try{let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);try{let r=await fetch('https://api.openbd.jp/v1/get?isbn='+isbn,{signal:ctrl.signal});if(r.ok){let j=await r.json(),x=j?.[0];if(x){book={isbn,title:x.summary?.title||'',author:cleanAuthor(x.summary?.author||''),cover:x.summary?.cover||''}}}}finally{clearTimeout(timer)}}catch(e){}if(!book?.title)try{let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);try{let r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn,{signal:ctrl.signal});if(r.ok){let j=await r.json(),x=j.items?.[0]?.volumeInfo;if(x)book={isbn,title:x.title||'',author:cleanAuthor((x.authors||[]).join('、')),cover:x.imageLinks?.thumbnail||''}}}finally{clearTimeout(timer)}}catch(e){}if(!book?.title){manualBook(isbn);return}confirmBook(book)}
function cleanAuthor(name){return String(name||'').replace(/\s*[,，]\s*\d{4}\s*[-–〜~]?\s*$/,'').trim()}
function confirmBook(book){book.author=cleanAuthor(book.author);modal(`<h2>この ほんで いいかな？</h2><div class="row"><div id="lookupCover" class="cover" style="background:${color(book.isbn)};margin:0">${esc(book.title)}</div><div class="grow"><h3>${esc(book.title)}</h3><p>${esc(cleanAuthor(book.author)||'さくしゃ ふめい')}</p></div></div><div class="actions"><button class="primary" id="acceptBook">このほんで きろく</button><button id="manualInstead">ちがう・じぶんで とうろく</button></div>`);if(book.cover){const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{if($('lookupCover'))$('lookupCover').innerHTML=`<img src="${esc(book.cover.replace(/^http:/,'https:'))}" alt="ひょうし">`};im.src=book.cover.replace(/^http:/,'https:')} $('acceptBook').onclick=async()=>{state.books[book.isbn]={isbn:book.isbn,title:book.title,author:book.author,source:'api'};if(!save())return;await storeRemoteCover(book.isbn,book.cover);registerRead(book.isbn)};$('manualInstead').onclick=()=>manualBook(book.isbn)}
async function storeRemoteCover(isbn,url){if(!url)return;try{const r=await fetch(url.replace(/^http:/,'https:'));if(!r.ok)return;let b=await resizeBlob(await r.blob());await coverPut(isbn,b)}catch(e){}}
function manualBook(isbn){pendingCover=null;modal(`<h2>ほんが みつからなかったよ</h2><p>ほんの なまえを じぶんで いれてね。</p><form id="manualForm"><label>ほんの なまえ（ひっす）</label><input name="title" required maxlength="150"><label>さくしゃ（いれなくても いいよ）</label><input name="author" maxlength="120"><label>ひょうしの しゃしん</label><input id="coverFile" type="file" accept="image/*" capture="environment"><div id="photoReview"></div><div class="actions"><button class="primary" type="submit">このほんで きろく</button><button type="button" onclick="closeModal()">もどる</button></div></form>`);$('coverFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{pendingCover=await resizeBlob(file);const url=URL.createObjectURL(pendingCover);$('photoReview').innerHTML=`<p>この しゃしんで いいかな？</p><img class="preview" src="${url}"><div class="actions"><button type="button" id="retake">とりなおす</button><button type="button" id="acceptPhoto" class="primary">これでいい</button></div>`;$('retake').onclick=()=>{pendingCover=null;$('coverFile').value='';$('photoReview').innerHTML=''};$('acceptPhoto').onclick=()=>{$('photoReview').innerHTML='<p>✓ しゃしんを きめたよ</p>'};}catch{alert('しゃしんを よみこめませんでした')}};$('manualForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim();if(!title)return;state.books[isbn]={isbn,title,author:String(f.get('author')).trim(),source:'manual'};if(!save())return;if(pendingCover)await coverPut(isbn,pendingCover);registerRead(isbn)}}
function resizeBlob(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,220/img.width,300/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(Error('encode'))},'image/jpeg',.75)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
window.addEventListener('scroll',()=>{if(innerHeight+scrollY>=document.body.offsetHeight-300&&state.profile){const count=Object.keys(state.books).length;if(viewLimit<count){viewLimit+=24;render()}}});window.addEventListener('offline',()=>alert('インターネットに つながっていません。ほんだなは みられます。'));load();render();
</script></body></html>
