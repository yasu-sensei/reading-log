'use strict';const KEY='reading-log-v24';let state={profile:null,books:{},reads:[]},stream=null,scanTimer=null,detector=null,pendingISBN=null,pendingCover=null,viewLimit=24;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

rm>');const keyboard=$('kanaKeyboard'),name=$('profileName');for(const row of kanaRows){const line=document.createElement('div');line.className='kana-line';for(const char of row){const btn=document.createElement('button');btn.type='button';btn.className='kana-key';btn.textContent=char;btn.onclick=()=>{if(Array.from(name.value).length>=30)return;name.value+=char;name.dispatchEvent(new Event('input',{bubbles:true}))};line.append(btn)}keyboard.append(line)}const actions=document.createElement('div');actions.className='kana-line';for(const [label,action] of [['ひとつ けす',()=>{name.value=Array.from(name.value).slice(0,-1).join('')}],['ぜんぶ けす',()=>{name.value=''}],['スペース',()=>{if(Array.from(name.value).length<30)name.value+='　'}]]){const btn=document.createElement('button');btn.type='button';btn.className='kana-edit';btn.textContent=label;btn.onclick=action;actions.append(btn)}keyboard.append(actions);$('profileForm').onsubmit=e=>{e.preventDefault();if(!name.value.trim()){alert('なまえを いれてね');return}if(edit&&!confirm('なまえなどを へんこうしますか？\nどくしょきろくは そのまま のこります。'))return;const next=Object.fromEntries(new FormData(e.target).entries());const previous=state.profile;state.profile=next;if(save()){closeModal();render()}else state.profile=previous}}

function uniqueCount(){return Object.keys(state.books).filter(isbn=>state.reads.some(r=>r.isbn===isbn)).length}function medals(){return [10,20,30,50,100].map((n,i)=>`<button class="medal ${uniqueCount()<n?'lock':''}" onclick="alert('${n}さつで メダル！\\nいま ${uniqueCount()}さつ よんだよ')"><div class="symbol">${['🥉','🥈','🥇','🏆','💎'][i]}</div><b>${n}さつ</b></button>`).join('')}

const DB='reading-log-covers';function db(){return new Promise((res,rej)=>{const req=indexedDB.open(DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('covers');req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}async function coverGet(k){try{const d=await db();return await new Promise(resolve=>{let r=d.transaction('covers').objectStore('covers').get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)})}catch{return null}}async function coverPut(k,blob){try{const d=await db();return await new Promise(resolve=>{let tx=d.transaction('covers','readwrite');tx.objectStore('covers').put(blob,k);tx.oncomplete=()=>resolve(true);tx.onerror=()=>resolve(false)})}catch{return false}}async function coverDelete(k){try{const d=await db();const tx=d.transaction('covers','readwrite');tx.objectStore('covers').delete(k)}catch{}}

function safeCoverUrl(url){try{const u=new URL(String(url||'').replace(/^http:/,'https:'));return u.protocol==='https:'?u.href:''}catch{return ''}}
function normalizedBookText(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/[\s　・:：!?！？「」『』（）()]/g,'')}
function plausibleBookMatch(info,book,isbn){const ids=info?.industryIdentifiers||[];if(ids.some(x=>String(x.identifier||'')===isbn))return true;const title=normalizedBookText(info?.title),expected=normalizedBookText(book.title);if(!title||!expected||!(title.includes(expected)||expected.includes(title)))return false;const author=normalizedBookText(book.author),authors=normalizedBookText((info.authors||[]).join(''));return !author||!authors||authors.includes(author)||author.includes(authors)}
async function searchCovers(isbn){const book=state.books[isbn];if(!book)return;if(!navigator.onLine){alert('インターネットに つないでね');return}modal('<h2>🔍 ひょうしを さがしているよ…</h2>');const candidates=[],seen=new Set(),diagnostics=[];function note(source,status){diagnostics.push(source+'：'+status)}function add(url,source,confidence){const u=safeCoverUrl(url);if(!u||seen.has(u)||candidates.length>=6)return;seen.add(u);candidates.push({url:u,source,confidence})}

function scanCorners(img){const w=img.width,h=img.height,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);const p=x.getImageData(0,0,w,h).data;const corners=[[.06,.06],[.94,.06],[.94,.94],[.06,.94]];const sample=(px,py)=>{const i=(Math.min(h-1,Math.max(0,py|0))*w+Math.min(w-1,Math.max(0,px|0)))*4;return[p[i],p[i+1],p[i+2]]};const bg=[sample(2,2),sample(w-3,2),sample(w-3,h-3),sample(2,h-3)];const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);let minX=w,minY=h,maxX=0,maxY=0,n=0;const step=Math.max(2,Math.round(Math.max(w,h)/260));for(let yy=step;yy<h-step;yy+=step)for(let xx=step;xx<w-step;xx+=step){const pixel=sample(xx,yy);if(Math.min(...bg.map(v=>dist(pixel,v)))>65){minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,yy);maxY=Math.max(maxY,yy);n++}}if(n>120&&maxX-minX>w*.24&&maxY-minY>h*.24&&maxX-minX<w*.96&&maxY-minY<h*.96)return[[minX/w,minY/h],[maxX/w,minY/h],[maxX/w,maxY/h],[minX/w,maxY/h]];return corners}
function scanWarp(img,pts,maxSide){const widthTop=Math.hypot((pts[1][0]-pts[0][0])*img.width,(pts[1][1]-pts[0][1])*img.height),widthBottom=Math.hypot((pts[2][0]-pts[3][0])*img.width,(pts[2][1]-pts[3][1])*img.height),heightLeft=Math.hypot((pts[3][0]-pts[0][0])*img.width,(pts[3][1]-pts[0][1])*img.height),heightRight=Math.hypot((pts[2][0]-pts[1][0])*img.width,(pts[2][1]-pts[1][1])*img.height);const ww=(widthTop+widthBottom)/2,hh=(heightLeft+heightRight)/2,scale=Math.min(1,maxSide/Math.max(ww,hh));const W=Math.max(1,Math.round(ww*scale)),H=Math.max(1,Math.round(hh*scale));if(W*H>1500000)throw Error('image too large');const source=document.createElement('canvas');source.width=img.width;source.height=img.height;const ctx=source.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);const pixels=ctx.getImageData(0,0,img.width,img.height).data;const out=document.createElement('canvas');out.width=W;out.height=H;const o=out.getContext('2d'),data=o.createImageData(W,H);const P=pts.map(([x,y])=>[x*img.width,y*img.height]);const ax=P[1][0]-P[2][0],ay=P[1][1]-P[2][1],bx=P[3][0]-P[2][0],by=P[3][1]-P[2][1],dx=P[0][0]-P[1][0]+P[2][0]-P[3][0],dy=P[0][1]-P[1][1]+P[2][1]-P[3][1],den=ax*by-bx*ay;const g=Math.abs(den)>1e-6?(dx*by-bx*dy)/den:0,h=Math.abs(den)>1e-6?(ax*dy-dx*ay)/den:0;const A=P[1][0]-P[0][0]+g*P[1][0],B=P[3][0]-P[0][0]+h*P[3][0],C=P[0][0],D=P[1][1]-P[0][1]+g*P[1][1],E=P[3][1]-P[0][1]+h*P[3][1],F=P[0][1];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=(x+.5)/W,v=(y+.5)/H,z=1+g*u+h*v,sx=Math.max(0,Math.min(img.width-1,Math.round((A*u+B*v+C)/z))),sy=Math.max(0,Math.min(img.height-1,Math.round((D*u+E*v+F)/z))),si=(sy*img.width+sx)*4,di=(y*W+x)*4;data.data[di]=pixels[si];data.data[di+1]=pixels[si+1];data.data[di+2]=pixels[si+2];data.data[di+3]=255}o.putImageData(data,0,0);return out}
async function cropCover(file,host,onSave){const img=new Image(),src=URL.createObjectURL(file);try{await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=src});const scale=Math.min(1,1100/img.width,1100/img.height),base=document.createElement('canvas');base.width=Math.round(img.width*scale);base.height=Math.round(img.height*scale);base.getContext('2d').drawImage(img,0,0,base.width,base.height);const picture=new Image();picture.src=base.toDataURL('image/jpeg',.9);await picture.decode();let pts=scanCorners(picture),brightness=1;host.innerHTML='<p>🔍 ひょうしの 4つの まるを うごかしてね</p><div id="scanStage" style="position:relative;max-width:430px;margin:auto;touch-action:none"><canvas id="scanCanvas" style="display:block;width:100%;border-radius:8px"></canvas></div><div class="actions"><button type="button" id="scanAuto">じどうで さがす</button><button type="button" id="scanReset">ぜんぶ うつす</button></div><label>あかるさ <input id="scanBrightness" type="range" min="80" max="130" value="100"></label><div id="scanPreview" style="text-align:center"></div><div class="actions"><button type="button" class="primary" id="scanCheck">かくにんする</button><button type="button" id="scanCancel">やめる</button></div>';const canvas=host.querySelector('#scanCanvas'),stage=host.querySelector('#scanStage'),ctx=canvas.getContext('2d');canvas.width=picture.width;canvas.height=picture.height;let active=-1;const draw=()=>{ctx.drawImage(picture,0,0);ctx.lineWidth=Math.max(3,picture.width/170);ctx.strokeStyle='#19e87b';ctx.beginPath();pts.forEach((p,i)=>{if(i)ctx.lineTo(p[0]*canvas.width,p[1]*canvas.height);else ctx.moveTo(p[0]*canvas.width,p[1]*canvas.height)});ctx.closePath();ctx.stroke();pts.forEach(p=>{ctx.beginPath();ctx.arc(p[0]*canvas.width,p[1]*canvas.height,Math.max(12,picture.width/42),0,Math.PI*2);ctx.fillStyle='#ffffff';ctx.fill();ctx.strokeStyle='#16844d';ctx.stroke()})};const pos=e=>{const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};stage.onpointerdo function editRead(id){let r=state.reads.find(r=>r.id===id);if(!r)return;readForm(r.isbn,r)}function deleteRead(id){if(!confirm('この どくしょきろくを けしますか？'))return;let r=state.reads.find(r=>r.id===id);state.reads=state.reads.filter(x=>x.id!==id);if(!state.reads.some(x=>x.isbn===r.isbn)){delete state.books[r.isbn];coverDelete(r.isbn)}if(save()){closeModal();render()}}
function registerRead(isbn){if(!navigator.onLine){alert('インターネットに つながってから きろくしてね');return}readForm(isbn)}function readForm(isbn,existing=null){const b=state.books[isbn];modal(`<h2>📖 ${esc(b.title)}</h2><p>ほんを よんだ きろくを つけよう</p><form id="readForm"><label>よんだ ひ</label><input name="date" type="date" required value="${existing?.date||new Date().toLocaleDateString('en-CA')}"><label>おもしろかった？</label><div class="row">${[[3,'😊','とても おもしろい'],[2,'🙂','おもしろい'],[1,'😐','ふつう']].map(([n,e,t])=>`<label style="flex:1;min-width:110px;text-align:center;border:2px solid #e6caa0;border-radius:15px;padding:12px"><input type="radio" name="rating" value="${n}" style="width:auto;min-height:auto" ${existing?.rating===n||(!existing&&n===3)?'checked':''}><div class="star">${e}</div>${t}</label>`).join('')}</div><div class="actions"><button class="primary" type="submit">きろくする</button><button type="button" onclick="closeModal()">やめる</button></div></form>`);$('readForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),date=f.get('date'),rating=Number(f.get('rating'));if(!existing&&state.reads.some(r=>r.isbn===isbn&&r.date===date)&&!confirm('このほんは おなじひに よんだ きろくが あるよ。\nもういちど きろくする？'))return;const before=uniqueCount();if(existing){existing.date=date;existing.rating=rating}else state.reads.push({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),isbn,date,rating,created:Date.now()});if(save()){closeModal();render();let after=uniqueCount();if(!existing&&[10,20,30,50,100].includes(after)&&after>before)alert(`🏅 ${after}さつ メダル！\nおめでとう！`)}}}
function showSettings(){if(!state.profile)return profileForm();modal(`<h2>⚙️ せってい</h2><p>${esc(state.profile.grade)}ねん ${esc(state.profile.classroom)}くみ　${esc(state.profile.number)}ばん　${esc(state.profile.name)}</p><div class="actions"><button onclick="profileForm(true)">じょうほうを なおす</button><button onclick="closeModal()">もどる</button></div><hr><h3>すべての きろくを けす</h3><p class="small">ほんだな・メダル・なまえが すべて きえます。もどせません。</p><label>「ぜんぶけす」と いれてね</label><input id="deleteConfirm" autocomplete="off"><div class="actions"><button class="danger" onclick="eraseAll()">ぜんぶ けす</button></div>`)}async function eraseAll(){if($('deleteConfirm')?.value!=='ぜんぶけす'){alert('かくにんの ことばが ちがうよ');return}if(!confirm('ほんとうに すべて けしますか？'))return;localStorage.removeItem(KEY);try{indexedDB.deleteDatabase(DB)}catch{}state={profile:null,books:{},reads:[]};closeModal();render()}
async function startScan(){if(!navigator.onLine){modal('<h2>オフラインです</h2><p>インターネットに つながってから とうろくしてね。</p><button onclick="closeModal()">もどる</button>');return}if(!navigator.mediaDevices?.getUserMedia){modal('<h2>カメラが つかえません</h2><p>HTTPSでひらくか、ほかのブラウザをつかってね。</p><button onclick="closeModal()">もどる</button>');return}modal(`<h2>📷 バーコードを よみとろう</h2><p>バーコードを わくに あわせてね　📖 ▥</p><div class="scanwrap"><video id="camera" autoplay playsinline muted></video><div class="scanframe"></div></div><p id="scanStatus" class="hint">カメラを じゅんびしているよ…</p><div class="actions"><button onclick="restartScan()">もういちど</button><button onclick="closeModal()">もどる</button></div>`);try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});if(!$('camera')){stopScan();return}$('camera').srcObject=stream;if(!('BarcodeDetector' in window)){ $('scanStatus').textContent='このブラウザはバーコードの自動読み取りに対応していません。対応ブラウザで開いてください。';return}detector=new BarcodeDetector({formats:['ean_13']});$('scanStatus').textContent='ISBNのバーコードを うつしてね';scanLoop()}catch(e){if($('scanStatus'))$('scanStatus').textContent='カメラを つかえません。カメラの きょかを かくにんしてね。'}}
async function scanLoop(){const v=$('camera');if(!v||!stream)return;try{if(v.readyState>=2){const results=await detector.detect(v);let found=results.map(x=>x.rawValue).find(s=>/^97[89]\d{10}$/.test(s));if(found){stopScan();lookup(found);return}}}catch(e){}scanTimer=setTimeout(scanLoop,350)}function stopScan(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null}function restartScan(){stopScan();startScan()}
async function fetchBookJson(url){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),8000);try{const r=await fetch(url,{signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function coverApiError(e){if(e?.name==='AbortError')return 'タイムアウト（8秒）';const m=String(e?.message||'');if(/^HTTP \d+/.test(m))return m;if(e instanceof TypeError)return '通信失敗（CORS・ネットワーク・アクセス制限など。ブラウザでは区別不可）';return '通信失敗（'+m.slice(0,100)+'）'}
function googleBookMatchesISBN(item,isbn){const ids=item?.volumeInfo?.industryIdentifiers||[];return ids.some(x=>String(x.identifier||'').replace(/[^0-9X]/gi,'')===isbn)}
function googleCover(info){const links=info?.imageLinks||{};return (links.large||links.medium||links.small||links.thumbnail||links.smallThumbnail||'').replace(/^http:/,'https:')}
async function lookup(isbn){pendingISBN=isbn;if(state.books[isbn]){registerRead(isbn);return}modal('<h2>🔎 ほんを さがしているよ…</h2><p class="center" style="font-size:35px">◌</p>');let book=null;
try{const j=await fetchBookJson('https://api.openbd.jp/v1/get?isbn='+encodeURIComponent(isbn)),x=j?.[0];if(x?.summary?.title)book={isbn,title:x.summary.title,author:cleanAuthor(x.summary.author||''),cover:x.summary.cover||''}}catch(e){}
if(!book?.title||!book.cover){try{const j=await fetchBookJson('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn));const item=(j.items||[]).find(x=>googleBookMatchesISBN(x,isbn));const info=item?.volumeInfo;if(info){if(!book?.title&&info.title)book={isbn,title:info.title,author:cleanAuthor((info.authors||[]).join('、')),cover:googleCover(info)};else if(book&&!book.cover)book.cover=googleCover(info)}}catch(e){}}
if(!book?.title){manualBook(isbn);return}confirmBook(book)}
function cleanAuthor(name){return String(name||'').replace(/\s*[,，]\s*\d{4}\s*[-–〜~]?\s*$/,'').trim()}
function confirmBook(book){book.author=cleanAuthor(book.author);modal(`<h2>この ほんで いいかな？</h2><div class="row"><div id="lookupCover" class="cover" style="background:${color(book.isbn)};margin:0">${esc(book.title)}</div><div class="grow"><h3>${esc(book.title)}</h3><p>${esc(cleanAuthor(book.author)||'さくしゃ ふめい')}</p></div></div><div class="actions"><button class="primary" id="acceptBook">このほんで きろく</button><button id="manualInstead">ちがう・じぶんで とうろく</button></div>`);if(book.cover){const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{if($('lookupCover'))$('lookupCover').innerHTML=`<img src="${esc(book.cover.replace(/^http:/,'https:'))}" alt="ひょうし">`};im.src=book.cover.replace(/^http:/,'https:')} $('acceptBook').onclick=async()=>{state.books[book.isbn]={isbn:book.isbn,title:book.title,author:book.author,source:'api'};if(!save())return;await storeRemoteCover(book.isbn,book.cover);registerRead(book.isbn)};$('manualInstead').onclick=()=>manualBook(book.isbn)}
async function storeRemoteCover(isbn,url){if(!url)return false;try{if(await coverGet(isbn))return true;const r=await fetch(url.replace(/^http:/,'https:'),{referrerPolicy:'no-referrer'});if(!r.ok)throw Error('HTTP '+r.status);const blob=await resizeBlob(await r.blob());return await coverPut(isbn,blob)}catch(e){console.warn('表紙画像を保存できませんでした:',e);return false}}
function manualBook(isbn){pendingCover=null;modal(`<h2>ほんが みつからなかったよ</h2><p>ほんの なまえを じぶんで いれてね。</p><form id="manualForm"><label>ほんの なまえ（ひっす）</label><input name="title" required maxlength="150"><label>さくしゃ（いれなくても いいよ）</label><input name="author" maxlength="120"><label>ひょうしの しゃしん</label>${cameraInput('coverFile')}<div id="photoReview"></div><div class="actions"><button class="primary" type="submit">このほんで きろく</button><button type="button" onclick="closeModal()">もどる</button></div></form>`);wireCamera('coverFile');$('coverFile').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{await cropCover(file,$('photoReview'),async blob=>{pendingCover=blob;if(!blob){$('coverFile').value='';return}$('photoReview').innerHTML='<p>✓ ひょうしを きめたよ</p>'})}catch(e){console.warn(e);alert('しゃしんを よみこめませんでした')}};$('manualForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')).trim();if(!title)return;state.books[isbn]={isbn,title,author:String(f.get('author')).trim(),source:'manual'};if(!save())return;if(pendingCover)await coverPut(isbn,pendingCover);registerRead(isbn)}}
function resizeBlob(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,220/img.width,300/img.height);c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(Error('encode'))},'image/jpeg',.75)};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('image'))};img.src=url})}
window.addEventListener('scroll',()=>{if(innerHeight+scrollY>=document.body.offsetHeight-300&&state.profile){const count=Object.keys(state.books).length;if(viewLimit<count){viewLimit+=24;render()}}});window.addEventListener('offline',()=>alert('インターネットに つながっていません。ほんだなは みられます。'));load();render();
</script></body></html>
